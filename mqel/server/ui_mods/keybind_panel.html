function api(method,path,body,done){

  t=setTimeout(function(){try{x.abort();}catch(e){}end(false,"");},5000);

function $id(i){return document.getElementById(i);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

  if(!state||!state.enabled||!binds)return out;
  for(i=0;i<MOVE.length;i++){hid=HID[state[MOVE[i][0]]];if(!hid)continue;
    for(a in binds){k=keyEntries(a);for(j=0;j<k.length;j++){e=k[j];if(e.Key==hid&&!e.RequiredModifiers)out.push(vkName(state[MOVE[i][0]])+" is also \""+label(a)+"\"");}}}

}

  var ign=like?like.IgnoredModifiers:2;ign=ign&~mods;
  return {"Key":key,"CanStillBeTriggeredWithShiftPressedA":like?!!like.CanStillBeTriggeredWithShiftPressedA:false,"IgnoredModifiers":ign,"IsGrabbable":true,"RequiredModifiers":mods};
}
function ensure(a){if(!binds[a])binds[a]={"ControllerShortcuts":[],"KeyboardShortcuts":[],"MouseShortcuts":[]};if(!binds[a].KeyboardShortcuts)binds[a].KeyboardShortcuts=[];return binds[a];}

function wasdPreset(){
  /* move keys free; camera on Q/E + arrows; Ability5 on R */
  var i;for(i=0;i<MOVE.length;i++)if(HID[state[MOVE[i][0]]])removeKey(HID[state[MOVE[i][0]]]);

  dirty=true;setMsg("WASD layout applied: camera on Q/E and arrow keys, Ability 5 on R. Press \"Save key binds\".","mqel-kb-ok");render();
}

function load(retry,intro){
  setMsg("");dirty=false;capture=null;state=null;binds=null;
  $id("mqel-kb-body").innerHTML="<div class='mqel-kb-note'>Connecting to the WASD helper...</div>";
  api("GET","/state",null,function(ok,t){
    if(!ok){if(!retry){setTimeout(function(){load(true,intro);},700);return;}render();return;}
    try{state=JSON.parse(t);}catch(e){state=null;}
    if(!intro&&state&&!state.enabled&&!state.layoutApplied)
      setMsg("WASD movement is off: your keys stay the game's own (potion on Q, camera on W/E). Tick \"Move the hero with the keyboard\" to switch it on, then restart the game once: the camera moves to Q/E and Ability 5 to R.","mqel-kb-ok");
    if(intro&&state){
      setMsg("New: WASD movement. During attacks W A S D move your hero; your mouse and clicks still aim and attack. "+
             (state.layoutApplied?"Your keys are set up for it: the camera rotates with Q/E (and the arrow keys), Ability 5 is on R. Change anything below.":
             "If W, A or D still rotate the camera, click \"Use WASD layout\", then \"Save key binds\" and restart the game once."),"mqel-kb-ok");
      state.layoutOffered=true;
    }
    api("GET","/binds",null,function(ok2,t2){if(ok2){try{binds=JSON.parse(t2);}catch(e){binds=null;}}render();diag();if(intro&&state)sendConfig();});
  });
}
function diag(){
  api("GET","/debug",null,function(ok,t){
    var d,el=$id("mqel-kb-diag");if(!el)return;
    if(!ok){el.innerHTML="";return;}
    try{d=JSON.parse(t);}catch(e){return;}
    if(d.version!=2){el.innerHTML=esc("Old WASD helper: restart the launcher to update the game.");return;}
    el.innerHTML=esc("Diagnostics: polls "+d.polls+", key frames "+d.keyFrames+", moved "+d.movedFrames+", presses "+d.presses+
      ", blocked: not in attack "+d.blockedAttack+", focus "+d.blockedFocus+", typing "+d.blockedTyping+", Alt "+d.blockedAlt+
      " | hooks "+d.hooksInstalled+" (cursor "+d.hookCursor+", key state "+d.hookKeyState+"/"+d.hookKeyboardState+"), attack msgs "+d.attackMsgs);
  });
}
function sendConfig(){
  api("POST","/config","enabled="+(state.enabled?1:0)+"&up="+state.up+"&left="+state.left+"&down="+state.down+"&right="+state.right+
    "&mode="+(state.mode==2?2:1)+"&attackonly="+(state.attackOnly===false?0:1)+"&radius="+(state.radius||10)+"&layoutoffered="+(state.layoutOffered?1:0)+"&lootplayer="+(state.lootPlayer?1:0),function(ok,t){
    if(ok){try{var p=JSON.parse(t);state.pendingBinds=p.pendingBinds;}catch(e){}}else setMsg("The WASD helper did not answer.","mqel-kb-err");render();});
}
function typing(on){api("POST","/typing",on?"1":"0",function(){});}

function onKey(ev){
  if(!open||!capture)return;
  ev.preventDefault();ev.stopPropagation();
  var vk=ev.keyCode,mods=0,hid,k,like;
  if(vk==27){capture=null;render();return;}
  if(capture.move){
    if(vk==16||vk==17||vk==18){return;}
    state[capture.move]=vk;capture=null;sendConfig();return;
  }
  if(vk!=17&&ev.ctrlKey)mods|=1;if(vk!=16&&ev.shiftKey)mods|=2;if(vk!=18&&ev.altKey)mods|=4;
  hid=HID[vk];if(!hid){setMsg("That key can't be used.","mqel-kb-err");capture=null;render();return;}
  k=ensure(capture.action).KeyboardShortcuts;like=k[capture.slot]||k[0];
  k[capture.slot]=entry(hid,mods,like);
  dirty=true;setMsg("Not saved yet.","mqel-kb-warn");capture=null;render();
}
function onClick(ev){
  var t=ev.target,a,j;
  if(!t||!t.getAttribute)return;
  if(t.id=="mqel-kb-close"){hide();return;}
  if(t.id=="mqel-kb-preset"){wasdPreset();return;}
  if(t.id=="mqel-kb-enabled"){state.enabled=!!t.checked;sendConfig();return;}
  if(t.id=="mqel-kb-attackonly"){state.attackOnly=!!t.checked;sendConfig();return;}
  if(t.id=="mqel-kb-lootplayer"){state.lootPlayer=!!t.checked;sendConfig();return;}
  if(t.name=="mqel-kb-mode"){state.mode=+t.value;sendConfig();return;}
  if(t.id=="mqel-kb-save"){
    if(!binds){return;}
    api("POST","/binds",JSON.stringify(binds,null,4),function(ok,r){
      if(ok){dirty=false;try{state.pendingBinds=JSON.parse(r).pendingBinds;}catch(e){}setMsg("Saved. These key binds take effect the next time you start the game.","mqel-kb-ok");}
      else setMsg("Saving failed (is the WASD helper installed?).","mqel-kb-err");render();});
    return;}
  if(t.id=="mqel-kb-discard"){api("POST","/binds/discard","",function(){load();});return;}
  if(t.getAttribute("data-move")){capture={move:t.getAttribute("data-move")};render();return;}
  a=t.getAttribute("data-action");
  if(a){capture={action:a,slot:+t.getAttribute("data-slot")};render();return;}
  a=t.getAttribute("data-clear");
  if(a){j=+t.getAttribute("data-slot");keyEntries(a).splice(j,1);dirty=true;setMsg("Not saved yet.","mqel-kb-warn");render();}
}
/* attack start/end -> DLL (movement only runs during attacks) */
function attack(on){api("POST","/attack",on?"1":"0",function(){});}
function bindAttackEvents(tries){
  var ec=window.hyperquest&&hyperquest.eventController,n,on=["startAttackEvent","attackLoadedEvent"],
      off=["showAttackReportEvent","serverEndAttackEndedEvent","closeAttackReportEvent"],ok=0;
  function b(name,val){if(ec&&ec[name]&&ec[name].bind){ec[name].bind(function(){attack(val);},window);ok++;}}
  for(n=0;n<on.length;n++)b(on[n],true);
  for(n=0;n<off.length;n++)b(off[n],false);
  if(!ok&&tries<60)setTimeout(function(){bindAttackEvents(tries+1);},1000);
}
function show(intro){open=true;$id("mqel-kb-panel").className="open";typing(true);load(false,intro);}
/* first lobby visit with the WASD helper installed: show the panel once */
function firstRun(){
  api("GET","/state",null,function(ok,t){
    var st;if(!ok||open)return;
    try{st=JSON.parse(t);}catch(e){return;}
    /* 2026-11-23: new players start with WASD off (game keys: potion on
       Q, camera on W/E): no pop-up for them, KEYS still opens the panel */
    if(st.layoutOffered||!st.enabled)return;
    show(true);
  });
}
function hide(){open=false;capture=null;$id("mqel-kb-panel").className="";typing(false);}

function init(){
  var p=$id("mqel-kb-panel"),b=$id("mqel-kb-button");
  if(!p||p.getAttribute("data-ready"))return;p.setAttribute("data-ready","1");
  p.addEventListener("click",onClick,false);
  p.addEventListener("change",function(ev){var t=ev.target;if(t&&t.id=="mqel-kb-radius"){state.radius=+t.value;sendConfig();}},false);
  p.addEventListener("input",function(ev){var t=ev.target,v=$id("mqel-kb-radius-val");if(t&&t.id=="mqel-kb-radius"&&v)v.innerHTML=t.value+"%";},false);
  document.addEventListener("keydown",onKey,true);
  if(b)b.addEventListener("click",function(ev){ev.preventDefault();if(open)hide();else show();},false);
  bindAttackEvents(0);
  attack(false); /* a (re)loaded lobby UI: not in an attack */
  setTimeout(firstRun,4000);
  /* chat and other text fields: don't move the hero while typing */
  document.addEventListener("focus",function(ev){var n=ev.target&&ev.target.tagName;if(!open&&(n=="INPUT"&&ev.target.type!="checkbox"&&ev.target.type!="radio"||n=="TEXTAREA"))typing(true);},true);
  document.addEventListener("blur",function(ev){var n=ev.target&&ev.target.tagName;if(!open&&(n=="INPUT"&&ev.target.type!="checkbox"&&ev.target.type!="radio"||n=="TEXTAREA"))typing(false);},true);
}
if(document.readyState=="loading")document.addEventListener("DOMContentLoaded",init,false);else init();
})();
