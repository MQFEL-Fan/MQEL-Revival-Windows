<script type="text/javascript">
(function(){
var BASES=MQEL_GE_URLS,base=null,w=null,unlocked=false,open=false,tab="weapon",ov=null,data=null,sel=null,msg="",msgCls="",busy=false;
var CLASS_BY_HERO={2:"knight",3:"archer",4:"mage",5:"runaway"};
var filt={klass:"",currency:"",sort:"ending",desc:false,q:""},mfilt={q:""},minePage=0,MINE_PER=6,tips=[];
function $id(i){return document.getElementById(i);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmt(n){n=Math.round(+n||0);return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function cur(c){return "<span class='mqel-cur "+(c=="bling"?"bling":"gold")+"'></span>";}
function money(n,c){return fmt(n)+cur(c);}
function left(t){var s=Math.max(0,Math.round(t-Date.now()/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return s<=0?"ending":(h?h+"h "+m+"m":m?m+"m":s+"s");}
function req(method,path,body,done,i){
  /* first server address that answers wins (127.0.0.1 on the server PC, else the public host) */
  var list=base?[base]:BASES;i=i||0;if(i>=list.length){done(0,{Error:"The server can't be reached."});return;}
  var x=new XMLHttpRequest(),fin=false,t=setTimeout(function(){try{x.abort();}catch(e){}},8000);
  x.onreadystatechange=function(){if(x.readyState!=4||fin)return;fin=true;clearTimeout(t);
    /* not this server (no reply, or another program on that port): next address */
    var ours=false;try{ours=!!x.getResponseHeader("X-MQEL");}catch(e){}
    if(!base&&(x.status===0||!ours)){req(method,path,body,done,i+1);return;}
    if(x.status)base=base||list[i];var d={};try{d=JSON.parse(x.responseText||"{}");}catch(e){}done(x.status,d);};
  try{x.open(method,list[i]+path,true);if(body!=null)x.setRequestHeader("Content-Type","text/plain");x.send(body!=null?JSON.stringify(body):null);}
  catch(e){fin=true;clearTimeout(t);if(!base)req(method,path,body,done,i+1);else done(0,{});}
}
function typing(on){try{var x=new XMLHttpRequest();x.open("POST","http://127.0.0.1:27631/typing",true);x.send(on?"1":"0");}catch(e){}}
function say(t,c){msg=t||"";msgCls=c||"";var f=$id("mqel-market-foot");if(f)f.innerHTML="<span class='"+msgCls+"'>"+esc(msg)+"</span>";}

/* -- session: web token for this account (server checks it is our game) -- */
function session(done){
  var id=window.hyperquest&&hyperquest.cache&&hyperquest.cache.AccountId;
  if(!id){done&&done(false);return;}
  req("GET","/market/session?a="+id,null,function(st,d){
    if(st==200&&d.w){w=d.w;unlocked=!!d.Unlocked;}else{w=null;}
    var b=$id("mqel-market-button");if(b)b.className=unlocked?"":"mqel-hidden";
    if(d&&d.Notice)notice(d.Notice);
    done&&done(!!w);});
}
function call(action,body,done){
  var go=function(retry){
    var path="/market/"+action,m="GET";
    if(body){m="POST";body.w=w;}else path+=(path.indexOf("?")<0?"?":"&")+"w="+encodeURIComponent(w||"");
    req(m,path,body,function(st,d){
      if((st==401||st==0)&&retry){base=null;session(function(ok){if(ok)go(false);else done(st,st==0?{Error:"Connection to the server lost (server update?). Close and reopen the window."}:d);});return;}
      done(st,d);});
  };
  if(!w)session(function(){go(false);});else go(true);
}
function get(action,qs,done){call(action+(qs?"?"+qs:""),null,done);}
function post(action,body,okMsg){
  if(busy)return;busy=true;say("Working...");
  call(action,body,function(st,d){busy=false;
    if(st==200){say(typeof okMsg=="function"?okMsg(d):okMsg,"ok");refresh();}
    else say(d.Error||(st?"Something went wrong ("+st+").":"The server can't be reached right now. Try again in a moment."),"err");});
}

/* -- window -- */
function show(){open=true;$id("mqel-market").className="mqel-win open";typing(true);
  if(!filt.klass){var h=window.hyperquest&&hyperquest.cache&&hyperquest.cache.selectedHeroId;filt.klass=CLASS_BY_HERO[h]||"any";}
  say("");refresh();}
function hide(){open=false;$id("mqel-market").className="mqel-win";typing(false);tipHide();}
function refresh(){
  get("overview","",function(st,d){if(st!=200){say(d.Error||"The Ingame Market can't be reached.","err");return;}ov=d;tabs();load();});
}
function tabs(){
  var t=[["weapon","Weapons"],["equipment","Equipment"],["items","Items"],["sell","Sell"],["mine","My offers"],["collect","Collect"]],h="",i,n;
  var c=ov?ov.Collect.Items.length+(ov.Collect.Gold?1:0)+(ov.Collect.Blings?1:0):0;
  for(i=0;i<t.length;i++){n=t[i][0]=="collect"&&c?"<b>"+c+"</b>":"";h+="<a class='mqel-tab"+(tab==t[i][0]?" on":"")+"' data-tab='"+t[i][0]+"'>"+t[i][1]+n+"</a>";}
  $id("mqel-market-tabs").innerHTML=h;
  $id("mqel-market-wallet").innerHTML=ov?money(ov.Gold,"gold")+" &nbsp; "+money(ov.Blings,"bling"):"";
  var badge=$id("mqel-market-badge");if(badge){badge.style.display=c?"block":"none";badge.innerHTML=c;}
}
function load(){
  var b=$id("mqel-market-body");
  if(ov&&!ov.Unlocked){b.innerHTML="<div class='mqel-empty'>Finish the castle crafting tutorial to unlock the Ingame Market.</div>";return;}
  if(tab=="weapon"||tab=="equipment"){
    get("items","category="+tab+"&class="+filt.klass+"&currency="+filt.currency+"&sort="+filt.sort+(filt.desc?"&desc=1":"")+"&q="+encodeURIComponent(filt.q),function(st,d){if(st==200){data=d;renderItems();}});
  }else if(tab=="items"){get("materials","q="+encodeURIComponent(mfilt.q),function(st,d){if(st==200){data=d;renderMaterials();}});}
  else if(tab=="sell")renderSell();else if(tab=="mine")renderMine();else renderCollect();
}
function iconUrl(p){return p&&base?base+"/market/icon/"+p:"";}
/* quality fill like the game's inventory (inv_box_50x50_<quality>.png behind the icon) */
function boxUrl(q){return "http://localhost/gamedata/Generated/Web/inv/box/50x50/inv_box_50x50_"+String(q||"Basic").toLowerCase()+".png";}
function tip(d){tips.push(d);return " data-tip='"+(tips.length-1)+"'";}
function icon(d){return "<div class='mqel-icon q-"+(d.Quality||"Basic")+"'"+tip(d)+" style=\"background-image:url('"+esc(iconUrl(d.Icon))+"'),url('"+boxUrl(d.Quality)+"')\">"+(d.Level&&d.Kind!="material"?"<em>"+d.Level+"</em>":d.Count>1?"<em>"+fmt(d.Count)+"</em>":"")+"</div>";}
function itemText(d){
  return "<div class='mqel-name t-"+(d.Quality||"Basic")+"'>"+esc(d.Name)+"</div><div class='mqel-sub'>Level "+d.Level+" "+esc(d.Quality)+" "+esc(d.Type)+" &middot; "+esc(ov.Classes[d.Class]||d.Class)+"</div>"+
    (d.Effects&&d.Effects.length?"<div class='mqel-fx'>"+esc(d.Effects.join(" • "))+"</div>":"");
}
function filters(){
  var k=["any","knight","archer","mage","runaway"],h="<div class='mqel-filters'><label>Class</label><select data-f='klass'>",i;
  for(i=0;i<k.length;i++)h+="<option value='"+k[i]+"'"+(filt.klass==k[i]?" selected":"")+">"+(k[i]=="any"?"Any class":ov.Classes[k[i]])+"</option>";
  h+="</select><label>Price in</label><select data-f='currency'><option value=''>Gold or blings</option><option value='gold'"+(filt.currency=="gold"?" selected":"")+">Gold</option><option value='bling'"+(filt.currency=="bling"?" selected":"")+">Blings</option></select>";
  /* sort: pick the same option again to reverse it */
  h+="<label>Sort</label><span class='mqel-dd' id='mqel-sort-dd'><a class='mqel-dd-btn' id='mqel-sort-btn'>"+sortLabel(filt.sort,filt.desc)+"</a><span class='mqel-dd-list'>";
  for(i=0;i<SORTS.length;i++)h+="<a data-sort='"+SORTS[i][0]+"'"+(filt.sort==SORTS[i][0]?" class='on'":"")+">"+(filt.sort==SORTS[i][0]?sortLabel(SORTS[i][0],!filt.desc):SORTS[i][1])+"</a>";
  return h+"<div class='hint'>Pick the same sort again to reverse it</div></span></span><input data-f='q' placeholder='Search' value='"+esc(filt.q)+"' style='width:150px'/></div>";
}
var SORTS=[["ending","Ending soon","Ending last"],["newest","Newest first","Oldest first"],["price","Price: low to high","Price: high to low"],["level","Level: high to low","Level: low to high"]];
function sortLabel(k,desc){for(var i=0;i<SORTS.length;i++)if(SORTS[i][0]==k)return desc?SORTS[i][2]:SORTS[i][1];return k;}
function renderItems(){
  tips=[];var h=filters()+"<div class='mqel-list two'>",i,d;
  if(!data.length)h+="<div class='mqel-empty'>Nothing for sale here yet. Sell your own items in the Sell tab.</div>";

var noticeAt=0,skew=0,noticeMsg="",quitting=false;
function notice(n){
  if(!n||!n.At){noticeAt=0;$id("mqel-notice").style.display="none";return;}
  noticeAt=n.At;skew=(n.Now||Date.now()/1000)-Date.now()/1000;noticeMsg=n.Message||"Server update";
  var d=new Date(n.At*1000);
  $id("mqel-notice-msg").innerHTML=esc(noticeMsg);
  $id("mqel-notice-at").innerHTML="The game closes at "+esc(d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}))+" (your time). Please finish your fight and log off.";
  $id("mqel-notice").style.display="block";tick();
}
function tick(){
  if(!noticeAt)return;
  var s=Math.round(noticeAt-(Date.now()/1000+skew)),el=$id("mqel-notice");
  if(s<=0){$id("mqel-notice-t").innerHTML="0:00";if(!quitting){quitting=true;quit();}return;}
  $id("mqel-notice-t").innerHTML=Math.floor(s/60)+":"+(s%60<10?"0":"")+(s%60);
  el.className=s<=60?"soon":"";
}
function poke(){
  var a=document.createElement("a");a.href="game://battlelog/RefreshFriends";a.style.display="none";
  document.body.appendChild(a);try{a.click();}catch(e){}setTimeout(function(){try{document.body.removeChild(a);}catch(e){}},500);

  /* the WASD helper ends the game process (like Alt+F4, killed after 2 s);
     game://pause/quitGame alone left MightyQuest.exe running */
  try{var x=new XMLHttpRequest();x.open("POST","http://127.0.0.1:27631/quit",true);x.send("1");}catch(e){}
  var a=document.createElement("a");a.href="game://pause/quitGame";a.style.display="none";document.body.appendChild(a);
  try{a.click();}catch(e){}
  setTimeout(function(){try{window.location.href="game://pause/quitGame";}catch(e){}},1500);
}
function pollNotice(){req("GET","/notice",null,function(st,d){if(st==200)notice(d);});}

function init(){
  var b=$id("mqel-market-button"),p=$id("mqel-market");
  if(b)b.addEventListener("click",function(ev){ev.preventDefault();if(open)hide();else if(w&&unlocked)show();else session(function(){if(unlocked)show();});},false);
  p.addEventListener("click",onClick,false);
  p.addEventListener("mouseover",tipOver,false);
  p.addEventListener("mousemove",function(ev){if(tipOn>=0)tipMove(ev);},false);
  p.addEventListener("mouseleave",tipHide,false);
  p.addEventListener("change",onChange,false);
  p.addEventListener("keydown",function(ev){ev.stopPropagation();if(ev.keyCode==13&&ev.target.getAttribute("data-f")){filt.q=ev.target.value;load();}},false);
  $id("mqel-shop-close").addEventListener("click",function(ev){ev.preventDefault();hideShop();},false);
  /* the game's "Purchase blings" links open the shop here when we have a session */
  document.addEventListener("click",function(ev){
    var t=ev.target;while(t&&t.tagName!="A")t=t.parentNode;
    if(!t||!/^game:\/\/shop\/showprimaryshop/i.test(t.getAttribute("href")||""))return;
    if(showShop()){ev.preventDefault();ev.stopPropagation();if(ev.stopImmediatePropagation)ev.stopImmediatePropagation();}
  },true);
  var escStop=function(ev){ev.preventDefault();ev.stopPropagation();if(ev.stopImmediatePropagation)ev.stopImmediatePropagation();};
  document.addEventListener("keydown",function(ev){
    if(ev.keyCode!=27)return;
    if($id("mqel-shop").className.indexOf("open")>=0){hideShop();escStop(ev);}
    else if(open){hide();escStop(ev);}
  },true);
  /* drag an item from the game's inventory onto this window: Sell tab with it selected */
  var dragSlot=null;
  document.addEventListener("mousedown",function(ev){
    var t=ev.target;dragSlot=null;
    while(t&&t.getAttribute){if(t.getAttribute("slot-index")!=null&&/inventory-grid-slot-index-/.test(t.className||"")){dragSlot=+t.getAttribute("slot-index");break;}t=t.parentNode;}
  },true);
  document.addEventListener("mouseup",function(ev){
    if(dragSlot==null||!open)return;var r=$id("mqel-market").getBoundingClientRect(),s2=dragSlot;dragSlot=null;
    if(ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom)return;
    if(!ov||!ov.Inventory)return;var i,hit=null;for(i=0;i<ov.Inventory.length;i++)if(ov.Inventory[i].Slot==s2)hit=ov.Inventory[i];
    if(!hit){say("That item can't be traded (or your bag isn't up to date yet).","err");return;}
    tab="sell";sellSel=s2;tabs();say("");renderSell();
  },true);
  var tries=0,t=setInterval(function(){tries++;if(window.hyperquest&&hyperquest.cache&&hyperquest.cache.AccountId){clearInterval(t);session();}else if(tries>100)clearInterval(t);},3000);
  session();
  setInterval(function(){if(!unlocked||!w)session();},60000);
  setInterval(function(){if(open&&(tab=="weapon"||tab=="equipment"||tab=="mine"))refresh();},30000);
  pollNotice();setInterval(pollNotice,20000);setInterval(tick,1000);
}
if(document.readyState=="loading")document.addEventListener("DOMContentLoaded",init,false);else init();
})();
</script>
